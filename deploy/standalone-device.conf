# Install as /etc/systemd/system/modulate-device.service.d/standalone.conf.
# Wants, not Requires: installed games still work if AI cannot start.
[Unit]
Wants=modulate-agent.service
After=modulate-agent.service

[Service]
ExecStart=
ExecStart=/home/pi/modulate-product/.venv/bin/python -m modulate.device --standalone --state-dir /home/pi/modulate-product/state --enrollment /home/pi/modulate-product/brain/device-enrollment.json
